<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>LocalStorage & Eruda – Lernarchiv</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-alt: #1b2640;
      --border: #2a3958;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #4ade80;
      --green-soft: rgba(74, 222, 128, 0.14);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.14);
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.14);
      --code-bg: #070b14;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 260px; /* Platz für Live-Konsole */
    }

    /* Header & Suche */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px;
    }

    .header-inner {
      max-width: 820px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 4px 9px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s, opacity 0.15s, background 0.15s;
    }
    button:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #06101f; }
    .btn-secondary { background: var(--surface-alt); color: var(--text); border-color: var(--border); }
    .btn-run { background: var(--green-soft); color: var(--green); border-color: rgba(74, 222, 128, 0.35); }
    .btn-copy { background: var(--accent-soft); color: var(--accent); border-color: rgba(56, 189, 248, 0.35); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: rgba(248, 113, 113, 0.35); }
    .btn-sm { padding: 5px 10px; font-size: 0.8rem; }

    /* Suchfeld */
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 38px 10px 36px;
      border-radius: 11px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 0.9rem;
      display: none;
    }
    .search-clear.visible { display: inline-flex; }

    /* Kategorie-Chips */
    .chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.45);
    }

    /* Hauptbereich */
    main {
      max-width: 820px;
      margin: 16px auto;
      padding: 0 16px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .cat-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--accent);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 10px;
      white-space: pre-line;
    }

    .aha-box {
      background: var(--amber-soft);
      border-left: 3px solid var(--amber);
      padding: 9px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 0.86rem;
      color: #fef3c7;
      margin-bottom: 12px;
    }

    /* Code-Block */
    .code-wrap {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px;
    }

    .code-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .code-lang {
      font-size: 0.74rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .code-actions {
      display: flex;
      gap: 6px;
    }

    pre {
      padding: 12px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.48;
      color: #e2e8f0;
      tab-size: 2;
    }

    .tags-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .tag {
      font-size: 0.74rem;
      color: var(--muted);
      background: var(--bg);
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    mark {
      background: rgba(251, 191, 36, 0.35);
      color: #fff;
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Fixierte Live-Konsole unten */
    .console-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: #070b14;
      border-top: 2px solid var(--accent);
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.65);
      transition: height 0.2s ease;
    }

    .console-header {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .console-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .console-body {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .console-dock.minimized .console-body {
      display: none;
    }

    .console-output {
      height: 135px;
      overflow-y: auto;
      padding: 8px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-line {
      padding: 3px 6px;
      border-radius: 4px;
      word-break: break-word;
      white-space: pre-wrap;
      border-left: 3px solid transparent;
    }
    .log-cmd { color: var(--accent); border-left-color: var(--accent); background: rgba(56, 189, 248, 0.06); }
    .log-info { color: #e2e8f0; border-left-color: #64748b; }
    .log-ret { color: var(--green); border-left-color: var(--green); }
    .log-warn { color: var(--amber); border-left-color: var(--amber); background: rgba(251, 191, 36, 0.08); }
    .log-err { color: var(--red); border-left-color: var(--red); background: rgba(248, 113, 113, 0.1); }

    .console-input-row {
      display: flex;
      border-top: 1px solid var(--border);
      background: #0b1120;
      padding: 6px 10px;
      gap: 6px;
      align-items: center;
    }

    .console-prompt {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .console-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      outline: none;
    }

    /* CSS Overlay Modals (kompatibel mit allen WebViews) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.78);
      padding: 16px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 20px;
      margin: auto;
    }

    .modal-box h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .form-group textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.83rem;
      min-height: 85px;
      resize: vertical;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid var(--accent);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="top-bar">
        <div class="brand">
          <span class="brand-badge">JS &gt;_</span>
          <h1>LocalStorage &amp; Eruda</h1>
        </div>
        <div class="top-actions">
          <button type="button" class="btn-secondary btn-sm" id="btn-backup">💾 Backup</button>
          <button type="button" class="btn-primary btn-sm" id="btn-add">+ Eintrag</button>
        </div>
      </div>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" class="search-input" placeholder="Suche nach Begriff, Befehl, Fehler, JSON, Timer...">
        <button type="button" id="search-clear" class="search-clear" title="Suche löschen">✕</button>
      </div>

      <div class="chips" id="category-chips">
        <button type="button" class="chip active" data-cat="alle">Alle</button>
        <button type="button" class="chip" data-cat="setup">Setup &amp; Eruda</button>
        <button type="button" class="chip" data-cat="begriffe">Begriffe &amp; Aha</button>
        <button type="button" class="chip" data-cat="basis">Basis-Befehle</button>
        <button type="button" class="chip" data-cat="praxis">Praxis &amp; Tests</button>
        <button type="button" class="chip" data-cat="speicher">Limits &amp; IndexedDB</button>
        <button type="button" class="chip" data-cat="eigene">Eigene Notizen</button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-bar">
      <span id="result-count">Bereit</span>
      <span id="ls-usage-badge">LocalStorage: 0.00 KB</span>
    </div>
    <div class="cards-list" id="cards-list"></div>
  </main>

  <!-- Fixierte Live-Konsole -->
  <section class="console-dock" id="console-dock">
    <div class="console-header">
      <div class="console-title">
        <span>● Live-Konsole (Sandbox)</span>
      </div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="btn-secondary btn-sm" id="btn-inspect-ls">📊 Speicher</button>
        <button type="button" class="btn-secondary btn-sm" id="btn-clear-console">🧹 Leeren</button>
        <button type="button" class="btn-secondary btn-sm" id="btn-toggle-console">▾ Einklappen</button>
      </div>
    </div>
    <div class="console-body">
      <div class="console-output" id="console-output"></div>
      <div class="console-input-row">
        <span class="console-prompt">&gt;</span>
        <input type="text" id="console-input" class="console-input" placeholder="Eigenen JS-Befehl eingeben, z.B. console.table(localStorage)">
        <button type="button" class="btn-primary btn-sm" id="btn-exec-input">Run</button>
      </div>
    </div>
  </section>

  <!-- Modal: Eintrag hinzufügen / bearbeiten -->
  <div class="modal-overlay" id="entry-modal">
    <div class="modal-box">
      <h2 id="modal-heading">Neuer Wissens-Eintrag</h2>
      <form id="entry-form">
        <input type="hidden" id="entry-id">
        <div class="form-group">
          <label for="entry-cat">Kategorie</label>
          <select id="entry-cat">
            <option value="eigene">Eigene Notizen</option>
            <option value="begriffe">Begriffe &amp; Aha</option>
            <option value="basis">Basis-Befehle</option>
            <option value="praxis">Praxis &amp; Tests</option>
            <option value="speicher">Limits &amp; IndexedDB</option>
            <option value="setup">Setup &amp; Eruda</option>
          </select>
        </div>
        <div class="form-group">
          <label for="entry-title">Titel / Befehl *</label>
          <input type="text" id="entry-title" placeholder="z. B. localStorage.key(0)" required>
        </div>
        <div class="form-group">
          <label for="entry-desc">Erklärung *</label>
          <textarea id="entry-desc" style="font-family:inherit; min-height:70px;" placeholder="Was macht der Befehl oder Begriff?" required></textarea>
        </div>
        <div class="form-group">
          <label for="entry-aha">Merksatz / Besonderheit (optional)</label>
          <input type="text" id="entry-aha" placeholder="z. B. Gibt null zurück, wenn der Index nicht existiert">
        </div>
        <div class="form-group">
          <label for="entry-code">Ausführbares Code-Beispiel (optional)</label>
          <textarea id="entry-code" placeholder="console.log(localStorage.length);"></textarea>
        </div>
        <div class="form-group">
          <label for="entry-tags">Schlagwörter (kommagetrennt)</label>
          <input type="text" id="entry-tags" placeholder="z. B. key, index, auslesen">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btn-close-entry">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Backup & Reset -->
  <div class="modal-overlay" id="backup-modal">
    <div class="modal-box">
      <h2>Backup &amp; Archiv-Verwaltung</h2>
      <p style="font-size:0.86rem; color:var(--muted); margin-bottom:12px;">
        Sichere deine eigenen Einträge und Änderungen als JSON-Text oder stelle einen Stand wieder her.
      </p>
      <div class="form-group">
        <label for="backup-text">JSON-Daten</label>
        <textarea id="backup-text" style="min-height:130px;"></textarea>
      </div>
      <div class="modal-footer" style="justify-content:space-between;">
        <button type="button" class="btn-danger btn-sm" id="btn-reset-defaults">↺ Standard wiederherstellen</button>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-secondary btn-sm" id="btn-copy-backup">📋 Kopieren</button>
          <button type="button" class="btn-primary btn-sm" id="btn-import-backup">📥 Importieren</button>
          <button type="button" class="btn-secondary btn-sm" id="btn-close-backup">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var STORAGE_KEY = 'ls_eruda_archiv_v1';

      var CATEGORY_LABELS = {
        setup: 'Setup & Eruda',
        begriffe: 'Begriffe & Aha',
        basis: 'Basis-Befehle',
        praxis: 'Praxis & Tests',
        speicher: 'Limits & IndexedDB',
        eigene: 'Eigene Notizen'
      };

      var DEFAULT_ENTRIES = [
        {
          id: 'def-1',
          category: 'setup',
          title: 'Eruda-Konsole auf Android Chrome nutzen',
          desc: 'Die mobile Chrome-App hat keine eingebaute Entwicklerkonsole. Mit Eruda (per Bookmarklet oder Script-Tag) blendest du eine vollwertige Konsole inklusive Resources-Tab (für localStorage) direkt auf dem Smartphone ein.',
          aha: 'Bei Webseiten mit strenger Sicherheitspolitik (CSP) blockiert Chrome manchmal Bookmarklets – dann hilft USB-Debugging über chrome://inspect/#devices am PC.',
          code: "// Prüfen, ob Eruda auf der aktuellen Seite aktiv ist:\nconsole.log('Eruda geladen:', typeof window.eruda !== 'undefined');",
          tags: ['eruda', 'android', 'chrome', 'konsole', 'bookmarklet']
        },
        {
          id: 'def-2',
          category: 'basis',
          title: 'Grundbefehle: Speichern, Lesen, Löschen (CRUD)',
          desc: 'Der localStorage speichert Daten dauerhaft als Schlüssel-Wert-Paare (Key-Value) für die aktuell geöffnete Domain. Selbst nach einem Neuladen oder Schließen des Browsers bleiben die Werte erhalten.',
          aha: 'Nutze bei eigenen Tests immer ein Präfix wie "test_", damit du keine echten Sitzungsdaten der Website überschreibst.',
          code: "localStorage.setItem('test_name', 'Max');\nconsole.log('Ausgelesen:', localStorage.getItem('test_name'));\n\n// Danach wieder sauber aufräumen:\nlocalStorage.removeItem('test_name');\nconsole.log('Nach Löschen:', localStorage.getItem('test_name'));",
          tags: ['setItem', 'getItem', 'removeItem', 'clear', 'crud']
        },
        {
          id: 'def-3',
          category: 'basis',
          title: 'Überblick über alle Einträge verschaffen',
          desc: 'Mit console.table(localStorage) oder Object.keys(localStorage) listest du alle gespeicherten Schlüssel und Werte der aktuellen Domain übersichtlich in der Konsole auf.',
          aha: 'localStorage.length zeigt dir sofort die Gesamtanzahl aller gespeicherten Einträge an.',
          code: "localStorage.setItem('test_demo1', 'Hallo');\nlocalStorage.setItem('test_demo2', 'Welt');\n\nconsole.log('Anzahl Einträge:', localStorage.length);\nconsole.log('Alle Schlüssel:', Object.keys(localStorage));\nconsole.table(localStorage);",
          tags: ['console.table', 'Object.keys', 'length', 'übersicht']
        },
        {
          id: 'def-4',
          category: 'begriffe',
          title: 'Die "Alles-ist-ein-String"-Falle',
          desc: 'localStorage akzeptiert ausschließlich Text (Strings). Zahlen (25) und Wahrheitswerte (false) werden beim Speichern automatisch in Text ("25", "false") umgewandelt.',
          aha: 'Der Text "false" ist in JavaScript nicht leer und gilt in einer if-Abfrage als WAHR (truthy)! Außerdem ergibt "25" + 5 die Zeichenkette "255" statt 30.',
          code: "localStorage.setItem('test_alter', 25);\nlocalStorage.setItem('test_flag', false);\n\nconst alter = localStorage.getItem('test_alter');\nconsole.log('Typ:', typeof alter, '| Rechnung + 5:', alter + 5);\nconsole.log('Richtig gerechnet:', Number(alter) + 5);\n\nlocalStorage.removeItem('test_alter');\nlocalStorage.removeItem('test_flag');",
          tags: ['string', 'typeof', 'boolean', 'false', 'falle', 'number']
        },
        {
          id: 'def-5',
          category: 'basis',
          title: 'Objekte & Arrays speichern (JSON.stringify / JSON.parse)',
          desc: 'Um ganze Einstellungsobjekte oder Listen im localStorage abzulegen, wandelst du sie vor dem Speichern mit JSON.stringify() in einen JSON-Text um und beim Auslesen mit JSON.parse() wieder in ein echtes JavaScript-Objekt zurück.',
          aha: 'Ohne JSON.stringify speichert JavaScript nur den unbrauchbaren Text "[object Object]".',
          code: "const profil = { darkmode: true, stufe: 3, tags: ['js', 'web'] };\nlocalStorage.setItem('test_profil', JSON.stringify(profil));\n\nconst geladen = JSON.parse(localStorage.getItem('test_profil'));\nconsole.log('Darkmode aktiv?', geladen.darkmode, '| Stufe:', geladen.stufe);\n\nlocalStorage.removeItem('test_profil');",
          tags: ['json', 'stringify', 'parse', 'objekt', 'array']
        },
        {
          id: 'def-6',
          category: 'begriffe',
          title: 'Rückgabewerte der Konsole: undefined, Timer-ID (295) & Promise',
          desc: 'Die Konsole druckt nach jedem Befehl dessen direkten Rückgabewert aus:\n• undefined: Befehl wurde ausgeführt, liefert aber keinen Wert zurück.\n• Zahl (z. B. 295): Die eindeutige ID eines mit setTimeout() gestarteten Timers (nützlich für clearTimeout(295)).\n• Promise {}: Ein "Versprechen" auf ein Ergebnis, das asynchron kurz danach eintrifft.',
          aha: 'Eine Zahl wie 295 direkt nach setTimeout ist kein Fehler, sondern die laufende Timer-Nummer der Webseite.',
          code: "const timerId = setTimeout(() => {\n  console.log('Timer fertig ausgeführt!');\n}, 1000);\n\nconsole.log('Direkt zurückgegebene Timer-ID:', timerId);",
          tags: ['undefined', 'timer', 'setTimeout', '295', 'promise', 'rückgabewert']
        },
        {
          id: 'def-7',
          category: 'praxis',
          title: 'Ablaufdatum (TTL – Time To Live) selbst bauen',
          desc: 'Da localStorage von Haus aus kein Verfallsdatum kennt, speicherst du den Wert zusammen mit einem Ziel-Zeitstempel (Date.now() + Sekunden * 1000) als JSON-Objekt und prüfst beim Auslesen, ob die Zeit abgelaufen ist.',
          aha: 'Ist Date.now() größer als der gespeicherte Ablaufwert, löscht die Funktion den Eintrag automatisch mit removeItem() und gibt null zurück.',
          code: "function setMitAblauf(key, wert, sekunden) {\n  const daten = { wert: wert, ablauf: Date.now() + sekunden * 1000 };\n  localStorage.setItem(key, JSON.stringify(daten));\n}\n\nfunction getMitAblauf(key) {\n  const roh = localStorage.getItem(key);\n  if (!roh) return null;\n  const daten = JSON.parse(roh);\n  if (Date.now() > daten.ablauf) {\n    localStorage.removeItem(key);\n    console.log('Abgelaufen & gelöscht:', key);\n    return null;\n  }\n  return daten.wert;\n}\n\nsetMitAblauf('test_token', 'Geheim123', 3);\nconsole.log('Sofort:', getMitAblauf('test_token'));\nsetTimeout(() => console.log('Nach 3.5 Sek:', getMitAblauf('test_token')), 3500);",
          tags: ['ttl', 'ablaufdatum', 'timeout', 'Date.now', 'token']
        },
        {
          id: 'def-8',
          category: 'praxis',
          title: 'Live-Funk zwischen zwei Tabs (storage-Event)',
          desc: 'Wenn dieselbe Website in zwei Browser-Tabs gleichzeitig geöffnet ist, informiert window.addEventListener("storage", ...) den anderen Tab sofort über jede Änderung im localStorage.',
          aha: 'Das storage-Event feuert bewusst NICHT im selben Tab, der die Änderung auslöst, sondern nur in allen anderen offenen Tabs derselben Domain.',
          code: "window.addEventListener('storage', (e) => {\n  console.log('Änderung aus anderem Tab:', e.key, '->', e.newValue);\n});\nconsole.log('Listener aktiv! Öffne diese Seite in einem 2. Tab und ändere dort localStorage.');",
          tags: ['storage', 'event', 'tab', 'kommunikation', 'addEventListener']
        },
        {
          id: 'def-9',
          category: 'speicher',
          title: 'Speicherlimit (QuotaExceededError) abfangen',
          desc: 'Browser begrenzen den localStorage auf ca. 5 MB pro Domain. Wird mehr geschrieben, wirft der Browser einen QuotaExceededError. Mit try { ... } catch (fehler) { ... } fängst du diesen Fehler sauber ab, ohne dass dein Skript abstürzt.',
          aha: 'Ein roter QuotaExceededError im catch-Block beweist, dass die Sicherheitsabfrage funktioniert.',
          code: "try {\n  const riesenText = 'x'.repeat(6 * 1024 * 1024); // ca. 6 MB\n  localStorage.setItem('test_zuGross', riesenText);\n} catch (fehler) {\n  console.error('Limit erreicht abgefangen:', fehler.name);\n} finally {\n  localStorage.removeItem('test_zuGross');\n}",
          tags: ['QuotaExceededError', 'limit', '5mb', 'try', 'catch', 'fehler']
        },
        {
          id: 'def-10',
          category: 'speicher',
          title: 'Gesamtspeicher & IndexedDB prüfen (storage.estimate)',
          desc: 'Mit navigator.storage.estimate() fragst du ab, wie viel Speicherplatz (quota, oft mehrere GB) der Browser für die Domain freigibt und wie viel davon durch IndexedDB oder Caches belegt ist (usageDetails).',
          aha: 'Wenn 5 MB im localStorage nicht reichen, ist die asynchrone IndexedDB die Lösung für große Offline-Datenmengen.',
          code: "const lsBytes = new Blob(Object.values(localStorage)).size;\nconsole.log('LocalStorage aktuell:', (lsBytes / 1024).toFixed(2), 'KB');\n\nif (navigator.storage && navigator.storage.estimate) {\n  navigator.storage.estimate().then(e => {\n    console.log('Gesamtlimit (GB):', (e.quota / 1024 / 1024 / 1024).toFixed(2));\n    console.log('usageDetails:', JSON.stringify(e.usageDetails || {}));\n  });\n}",
          tags: ['estimate', 'usageDetails', 'indexedDB', 'quota', 'verbrauch']
        }
      ];

      var entries = [];
      var activeCategory = 'alle';
      var searchQuery = '';

      function loadEntries() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              entries = parsed;
              return;
            }
          }
        } catch (e) {
          console.warn('Konnte gespeicherte Einträge nicht lesen:', e);
        }
        entries = JSON.parse(JSON.stringify(DEFAULT_ENTRIES));
        saveEntries();
      }

      function saveEntries() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        } catch (e) {
          showToast('Speicherfehler: ' + e.message);
        }
        updateStorageBadge();
      }

      function updateStorageBadge() {
        var badge = document.getElementById('ls-usage-badge');
        try {
          var vals = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            vals.push(k + (localStorage.getItem(k) || ''));
          }
          var bytes = new Blob(vals).size;
          badge.textContent = 'LocalStorage gesamt: ' + (bytes / 1024).toFixed(2) + ' KB (' + localStorage.length + ' Keys)';
        } catch (e) {
          badge.textContent = 'LocalStorage aktiv';
        }
      }

      function showToast(msg) {
        var toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () {
          toast.classList.remove('show');
        }, 2200);
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function highlightText(text, query) {
        var safe = escapeHtml(text);
        if (!query) return safe;
        var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var regex = new RegExp('(' + escapedQuery + ')', 'gi');
        return safe.replace(regex, '<mark>$1</mark>');
      }

      function renderCards() {
        var listEl = document.getElementById('cards-list');
        var countEl = document.getElementById('result-count');
        var q = searchQuery.trim().toLowerCase();

        var filtered = entries.filter(function (item) {
          var catOk = activeCategory === 'alle' || item.category === activeCategory;
          if (!catOk) return false;
          if (!q) return true;
          var haystack = [
            item.title,
            item.desc,
            item.aha,
            item.code,
            (item.tags || []).join(' '),
            CATEGORY_LABELS[item.category] || ''
          ].join(' ').toLowerCase();
          return haystack.indexOf(q) !== -1;
        });

        countEl.textContent = filtered.length + ' von ' + entries.length + ' Einträgen';
        listEl.innerHTML = '';

        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--muted); padding:28px;">Keine passenden Einträge gefunden. Passe deine Suche an oder erstelle über <strong>+ Eintrag</strong> eine neue Notiz.</div>';
          return;
        }

        filtered.forEach(function (item) {
          var card = document.createElement('article');
          card.className = 'card';

          var catName = CATEGORY_LABELS[item.category] || item.category;
          var tagsHtml = (item.tags || []).map(function (t) {
            return '<span class="tag">#' + highlightText(t, searchQuery.trim()) + '</span>';
          }).join('');

          var ahaHtml = item.aha
            ? '<div class="aha-box"><strong>💡 Merksatz:</strong> ' + highlightText(item.aha, searchQuery.trim()) + '</div>'
            : '';

          var codeHtml = '';
          if (item.code && item.code.trim()) {
            codeHtml =
              '<div class="code-wrap">' +
                '<div class="code-toolbar">' +
                  '<span class="code-lang">JavaScript</span>' +
                  '<div class="code-actions">' +
                    '<button type="button" class="btn-copy btn-sm" data-action="copy" data-id="' + escapeHtml(item.id) + '">📋 Kopieren</button>' +
                    '<button type="button" class="btn-run btn-sm" data-action="run" data-id="' + escapeHtml(item.id) + '">▶ Ausführen</button>' +
                  '</div>' +
                '</div>' +
                '<pre><code>' + highlightText(item.code, searchQuery.trim()) + '</code></pre>' +
              '</div>';
          }

          card.innerHTML =
            '<div class="card-header">' +
              '<div>' +
                '<div class="card-meta"><span class="cat-tag">' + escapeHtml(catName) + '</span></div>' +
                '<h2 class="card-title">' + highlightText(item.title, searchQuery.trim()) + '</h2>' +
              '</div>' +
              '<div style="display:flex; gap:6px; flex-shrink:0;">' +
                '<button type="button" class="btn-secondary btn-sm" data-action="edit" data-id="' + escapeHtml(item.id) + '" title="Bearbeiten">✏️</button>' +
                '<button type="button" class="btn-danger btn-sm" data-action="delete" data-id="' + escapeHtml(item.id) + '" title="Löschen">🗑️</button>' +
              '</div>' +
            '</div>' +
            '<p class="card-desc">' + highlightText(item.desc, searchQuery.trim()) + '</p>' +
            ahaHtml +
            codeHtml +
            (tagsHtml ? '<div class="tags-row">' + tagsHtml + '</div>' : '');

          listEl.appendChild(card);
        });
      }

      /* Live-Konsole Logik */
      var consoleOut = document.getElementById('console-output');

      function formatArg(val) {
        if (val === undefined) return 'undefined';
        if (val === null) return 'null';
        if (typeof val === 'string') return val;
        if (val instanceof Error) return val.name + ': ' + val.message;
        try {
          return JSON.stringify(val);
        } catch (e) {
          return String(val);
        }
      }

      function appendLog(type, text) {
        var line = document.createElement('div');
        line.className = 'log-line log-' + type;
        line.textContent = text;
        consoleOut.appendChild(line);
        consoleOut.scrollTop = consoleOut.scrollHeight;
      }

      function runCodeInSandbox(codeStr) {
        var dock = document.getElementById('console-dock');
        dock.classList.remove('minimized');
        document.getElementById('btn-toggle-console').textContent = '▾ Einklappen';

        var preview = codeStr.trim().split('\n')[0];
        if (codeStr.trim().split('\n').length > 1) preview += ' ...';
        appendLog('cmd', '> ' + preview);

        var customConsole = {
          log: function () {
            var args = Array.prototype.slice.call(arguments);
            appendLog('info', args.map(formatArg).join(' '));
            console.log.apply(console, args);
          },
          warn: function () {
            var args = Array.prototype.slice.call(arguments);
            appendLog('warn', '⚠️ ' + args.map(formatArg).join(' '));
            console.warn.apply(console, args);
          },
          error: function () {
            var args = Array.prototype.slice.call(arguments);
            appendLog('err', '✖ ' + args.map(formatArg).join(' '));
            console.error.apply(console, args);
          },
          table: function (data) {
            if (data === localStorage) {
              var obj = {};
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                obj[k] = localStorage.getItem(k);
              }
              appendLog('info', '📊 Tabelle (localStorage):\n' + JSON.stringify(obj, null, 2));
            } else {
              appendLog('info', '📊 Tabelle:\n' + JSON.stringify(data, null, 2));
            }
          }
        };

        try {
          var fn = new Function('console', codeStr);
          var result = fn(customConsole);
          if (result !== undefined) {
            appendLog('ret', '← ' + formatArg(result));
          }
        } catch (err) {
          appendLog('err', '✖ ' + err.name + ': ' + err.message);
        }

        setTimeout(updateStorageBadge, 50);
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast('Code in Zwischenablage kopiert!');
          }).catch(function () {
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('Code kopiert!');
        } catch (e) {
          showToast('Kopieren fehlgeschlagen');
        }
        document.body.removeChild(ta);
      }

      /* Event Delegation für Karten-Buttons */
      document.getElementById('cards-list').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        var id = btn.getAttribute('data-id');
        var item = entries.find(function (x) { return x.id === id; });
        if (!item) return;

        if (action === 'copy') {
          copyText(item.code || '');
        } else if (action === 'run') {
          runCodeInSandbox(item.code || '');
        } else if (action === 'edit') {
          openEntryModal(item);
        } else if (action === 'delete') {
          if (confirm('Eintrag "' + item.title + '" wirklich löschen?')) {
            entries = entries.filter(function (x) { return x.id !== id; });
            saveEntries();
            renderCards();
            showToast('Eintrag gelöscht');
          }
        }
      });

      /* Suche & Filter */
      var searchInput = document.getElementById('search-input');
      var searchClear = document.getElementById('search-clear');

      searchInput.addEventListener('input', function () {
        searchQuery = searchInput.value;
        searchClear.classList.toggle('visible', searchQuery.length > 0);
        renderCards();
      });

      searchClear.addEventListener('click', function () {
        searchInput.value = '';
        searchQuery = '';
        searchClear.classList.remove('visible');
        renderCards();
        searchInput.focus();
      });

      document.getElementById('category-chips').addEventListener('click', function (e) {
        var chip = e.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
        chip.classList.add('active');
        activeCategory = chip.getAttribute('data-cat');
        renderCards();
      });

      /* Modal: Eintrag erstellen / bearbeiten */
      var entryModal = document.getElementById('entry-modal');
      var entryForm = document.getElementById('entry-form');

      function openEntryModal(item) {
        entryForm.reset();
        if (item) {
          document.getElementById('modal-heading').textContent = 'Eintrag bearbeiten';
          document.getElementById('entry-id').value = item.id;
          document.getElementById('entry-cat').value = item.category || 'eigene';
          document.getElementById('entry-title').value = item.title || '';
          document.getElementById('entry-desc').value = item.desc || '';
          document.getElementById('entry-aha').value = item.aha || '';
          document.getElementById('entry-code').value = item.code || '';
          document.getElementById('entry-tags').value = (item.tags || []).join(', ');
        } else {
          document.getElementById('modal-heading').textContent = 'Neuer Wissens-Eintrag';
          document.getElementById('entry-id').value = '';
        }
        entryModal.classList.add('open');
      }

      document.getElementById('btn-add').addEventListener('click', function () {
        openEntryModal(null);
      });

      document.getElementById('btn-close-entry').addEventListener('click', function () {
        entryModal.classList.remove('open');
      });

      entryForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var id = document.getElementById('entry-id').value;
        var tagsRaw = document.getElementById('entry-tags').value;
        var tags = tagsRaw.split(',').map(function (t) { return t.trim(); }).filter(Boolean);

        var newObj = {
          id: id || 'custom-' + Date.now(),
          category: document.getElementById('entry-cat').value,
          title: document.getElementById('entry-title').value.trim(),
          desc: document.getElementById('entry-desc').value.trim(),
          aha: document.getElementById('entry-aha').value.trim(),
          code: document.getElementById('entry-code').value.trim(),
          tags: tags
        };

        if (id) {
          var idx = entries.findIndex(function (x) { return x.id === id; });
          if (idx !== -1) entries[idx] = newObj;
          showToast('Eintrag aktualisiert');
        } else {
          entries.unshift(newObj);
          showToast('Neuer Eintrag gespeichert');
        }

        saveEntries();
        renderCards();
        entryModal.classList.remove('open');
      });

      /* Modal: Backup */
      var backupModal = document.getElementById('backup-modal');
      var backupText = document.getElementById('backup-text');

      document.getElementById('btn-backup').addEventListener('click', function () {
        backupText.value = JSON.stringify(entries, null, 2);
        backupModal.classList.add('open');
      });

      document.getElementById('btn-close-backup').addEventListener('click', function () {
        backupModal.classList.remove('open');
      });

      document.getElementById('btn-copy-backup').addEventListener('click', function () {
        copyText(backupText.value);
      });

      document.getElementById('btn-import-backup').addEventListener('click', function () {
        try {
          var imported = JSON.parse(backupText.value);
          if (!Array.isArray(imported)) throw new Error('Ungültiges Format (Array erwartet)');
          entries = imported;
          saveEntries();
          renderCards();
          backupModal.classList.remove('open');
          showToast('Backup erfolgreich importiert!');
        } catch (err) {
          alert('Import-Fehler: ' + err.message);
        }
      });

      document.getElementById('btn-reset-defaults').addEventListener('click', function () {
        if (confirm('Alle Einträge auf den ursprünglichen Leitfaden zurücksetzen? Eigene Notizen gehen dabei verloren.')) {
          entries = JSON.parse(JSON.stringify(DEFAULT_ENTRIES));
          saveEntries();
          renderCards();
          backupModal.classList.remove('open');
          showToast('Standard-Leitfaden wiederhergestellt');
        }
      });

      /* Live-Konsole Controls */
      var consoleInput = document.getElementById('console-input');

      document.getElementById('btn-exec-input').addEventListener('click', function () {
        var val = consoleInput.value.trim();
        if (!val) return;
        runCodeInSandbox(val);
        consoleInput.value = '';
      });

      consoleInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('btn-exec-input').click();
        }
      });

      document.getElementById('btn-clear-console').addEventListener('click', function () {
        consoleOut.innerHTML = '';
      });

      document.getElementById('btn-inspect-ls').addEventListener('click', function () {
        runCodeInSandbox("console.table(localStorage);");
      });

      document.getElementById('btn-toggle-console').addEventListener('click', function () {
        var dock = document.getElementById('console-dock');
        dock.classList.toggle('minimized');
        this.textContent = dock.classList.contains('minimized') ? '▴ Ausklappen' : '▾ Einklappen';
      });

      /* Initialisierung */
      loadEntries();
      renderCards();
      updateStorageBadge();
      appendLog('info', 'Sandbox bereit. Klicke bei einem Beispiel auf "▶ Ausführen" oder gib unten eigenen Code ein.');
    })();
  </script>
